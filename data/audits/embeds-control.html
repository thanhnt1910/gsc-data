    width: 100%;

    display: flex;
    flex-direction: column;

    [pull~="left"]{
    justify-content: flex-start;

    header[mobile]{
    display: none;
}


    header{
    /* position: fixed; */
    display: flex;
    width: 1256px;
    max-width: 100%;
    padding:16px;
    left: 0;
    right: 0;
    margin:auto;
    z-index: 10000;
}


    header > div {

    display: flex;
    width:100%;
    flex-direction: row;
    align-items: center;
    padding: 12px;
    gap: 24px;

    border-radius: 16px;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.8);
    box-shadow: 0px 6px 12px rgba(16, 20, 30, 0.05), 0px 8px 8px rgba(16, 20, 30, 0.1), 0px 0px 8px rgba(16, 20, 30, 0.05);
    backdrop-filter: blur(8px);
}


    header [logo]{
    display: flex;
    gap:24px;
    justify-content: space-between;
}


    header [logo] a{
    display: flex;
    gap:8px;
}


    [search]{
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    padding: 0px;
    background: #F3F3F4;

    width: 320px;
    height: 40px;

    border-radius: 8px;
    padding:10px 12px;
}

    [search] input[type="text"]{
    display: inline-flex;
    height: 100%;
    width:100%;
    border: none;
    background: none;
    outline: none;
}


    [top-menu]{
    display: flex;
    flex-direction: row;
    gap:22px;
    align-items: center;
    padding-right:22px;
}

    [top-menu] a{
    font-weight: 400;
    font-size: 14px;
    line-height: 20px;

    display: flex;
    align-items: center;
    color: #40434B;
    text-decoration: none;
}

    [top-menu] a:hover{
    color:#183DFF;
}

    [top-menu] a[selected]{
    color:#06080C;
    position: relative;
}

    [top-menu] a[selected]:after{
    content: " ";
    position: absolute;
    bottom:-4px;
    width:100%;
    height:2px;
    background-color: #183DFF;
}


    [heading]{
    display: block;
    margin:16px 0;
}


    [outline]{
    border:2px solid #183DFF;
}

    [outline~="blue"]{
    border-color: #183DFF;
}

    [outline~="thin"]{
    border:1px solid #ffffff;
}


    [outline~="grey"]{
    border-color: #E7E7E8 !important;
}


    [button]{
    display: inline-flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    padding: 12px 16px;
    gap: 8px;
    border-radius: 8px;
    text-decoration: none;
    overflow: hidden;
    white-space: nowrap;
    height: max-content;
}

    [button~="hover-label"]{
    position:relative;
    overflow:visible;
}

    [button~="hover-label"] label {
    opacity:0;
    pointer-events:none;
    position:absolute;
    bottom:100%;
    margin-bottom:10px;
    border-radius:5px;
    color:#183dff;
    background: #d1d8ff;
    border:1px solid #183dff;
    padding:10px 10px;
}

    [button~="hover-label"]:hover label {
    opacity:1;
}



    [button][close]{
    background-color:#636363;
}

    [button][close]:hover{
    background-color:#000;
}

    [button~="blue"]{
    background-color: #183DFF;
    color:#fff !important;
}

    [button~="blue"]:hover{
    background-color: #1331CC;
}

    [button~="green"]{
    background-color: #04c40c;
    color:#fff !important;
}

    [button~="green"]:hover{
    filter: brightness(90%);
}


    [button~="red"]{
    background-color: rgb(187, 3, 3);
    color:#fff !important;
}

    [button~="plus"]:before{
    content: " ";
    width:20px;
    height:20px;
    background: url('../images/icons/plus.svg') no-repeat center center / cover;
}


    [hero]{
    width:100%;
    padding-top:102px;
    margin:auto;
    max-width: 100%;
}

    [hero] [slides-holder]{
    /*width:var(--hero-slides-holder-width);*/
    /*height: var(--hero-slides-holder-height);*/

    max-width: 100%;
    max-height: 100%;

    display: grid;
    grid-template-columns: 1fr;

}



    [columns]{
    display: grid !important;
    width:100%;
}

    [columns] > *{
    max-width: 100%;
}


    [columns~="auto"]{
    grid-template-columns: repeat( auto-fit, minmax(250px, 1fr) );
}

    [columns~="200"]{
    grid-template-columns: repeat( auto-fit, 200px);
    justify-content: center;
}

    [columns~="autofit"]{
    grid-template-columns: repeat( auto-fit, var(--games-catalogue-column-width));
    justify-content: center;
    position: relative;
    /*z-index:-1;*/
}

    [columns~="3-1"]{
    grid-template-columns: 3fr 1fr;
}

    [columns~="1-1"]{
    grid-template-columns: 1fr 1fr;
}

    /*
    [columns~="1-1"] > div{
    max-width: 100%;
    min-width:50%;
    overflow: hidden;
}
    */


    [columns~="1-3"]{
    grid-template-columns: 1fr 3fr;
}

    [columns~="2-3"]{
    grid-template-columns: 2fr 3fr;
}

    /* Dropdown seelct */
    .container {
    display: flex;
    flex-flow: row wrap;

}
    .container__title {

}
    .select-dropdown {
    position: relative;
    display: inline-block;
    max-width: 100%;
    width:100%;
    padding-bottom:1px;
}

    span.select-dropdown{
    display: flex;
}

    .select-dropdown:last-child {
    margin-right: 0px;
}
    .select-dropdown__button {
    padding: 10px 35px 10px 15px;
    background-color: #fff;
    color: #616161;
    border: 1px solid #cecece;
    border-radius: 3px;
    cursor: pointer;
    width: 210px;
    text-align: left;
    border-radius: 8px;
    display:flex;
}
    .select-dropdown__button:focus {
    outline: none;
}
    .select-dropdown__button .zmdi-chevron-down {
    position: absolute;
    right: 10px;
    top: 12px;
}
    .select-dropdown__list {
    position: absolute;
    display: block;
    left: 0;
    right: 0;
    max-height: 300px;
    overflow: auto;
    margin: 0;
    padding: 0;
    border: 1px solid #cecece;
    border-top: 0px solid transparent;
    list-style-type: none;
    opacity: 0;
    pointer-events: none;
    transform-origin: top left;
    transform: scale(1, 0);
    transition: all ease-in-out 0.3s;
    z-index: 2;
    width: min-content;
    left: auto;
}
    .select-dropdown__list.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1, 1);
    /*border-radius:8px;*/
}
    .select-dropdown__list-item {
    display: block;
    list-style-type: none;
    padding: 10px 15px;
    background: #fff;
    border-top: 1px solid #e6e6e6;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
    color: #616161;
    text-align: left;
    transition: all ease-in-out 0.3s;
    white-space: nowrap;
}
    .select-dropdown__list-item:hover {
    background-color: #183DFF;
    color: #fff;
    transition: all ease-in-out 0.3s;
}


    .select-dropdown__button{
    position: relative;
    width: 100%;
}

    .select-dropdown__button:after {
    content: " ";
    width: 40px;
    height: 100%;
    position: absolute;
    top: 0;
    right: 0;
    background: url(../images/icons/gt.svg) no-repeat center center;
}
