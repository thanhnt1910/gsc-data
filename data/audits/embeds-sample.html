  .player-splash-logo {
    position: relative;
    z-index: 2;
    width: auto;
    height: auto;
    max-width: min(360px, 72vw);
    max-height: 220px;
    object-fit: contain;
    filter:
      drop-shadow(0 0 6px rgba(251, 191, 36, .22))
      drop-shadow(0 8px 22px rgba(0, 0, 0, .55));
    opacity: 0;
    transform: translateY(12px) scale(.85);
    animation: splashLogoIn .8s var(--ease-pop, cubic-bezier(.34, 1.56, .64, 1)) .55s forwards;
  }

  .player-splash-logo-scrim {
    --splash-scrim-strength: 1;
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 50%;
    width: 135%;
    height: 150%;
    transform: translate(-50%, -50%);
    background: radial-gradient(
      ellipse at center,
      rgba(251, 191, 36, calc(.26 * var(--splash-scrim-strength))) 0%,
      rgba(251, 191, 36, calc(.16 * var(--splash-scrim-strength))) 32%,
      rgba(251, 191, 36, calc(.07 * var(--splash-scrim-strength))) 54%,
      rgba(251, 191, 36, 0) 74%
    );
    pointer-events: none;
    opacity: 0;
    animation: splashFadeIn .7s ease .5s forwards;
  }
  @keyframes splashLogoIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (max-width: 560px) {
    .player-splash-logo {
      max-width: 78vw;
      max-height: 168px;
    }
  }

  .player-splash-title {
    display: none;
    font-size: clamp(26px, 4.6vw, 40px);
    font-weight: 900;
    letter-spacing: -.02em;
    color: #fff;
    line-height: 1.05;
    margin: 6px 0 0;
    text-shadow:
      0 4px 30px rgba(0, 0, 0, .6),
      0 2px 8px rgba(0, 0, 0, .4);
  }
  .player-splash-card.is-emblem .player-splash-title {
    display: block;
    opacity: 0;
    transform: translateY(10px);
    animation: splashTitleIn .7s var(--ease-pop, cubic-bezier(.34, 1.56, .64, 1)) .9s forwards;
  }
  .player-splash-card.is-emblem .player-splash-logo {
    max-width: min(180px, 46vw);
    max-height: 130px;
  }
  @media (max-width: 560px) {
    .player-splash-card.is-emblem .player-splash-logo {
      max-width: 42vw;
      max-height: 110px;
    }
  }

  .player-splash-byline {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .05em;
    color: rgba(255, 255, 255, .55);
    text-transform: uppercase;
    opacity: 0;
    animation: splashFadeIn .5s ease 1.1s forwards;
  }

  .player-splash-stats {
    margin-top: 24px;
    display: inline-flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .player-splash-stat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(0, 0, 0, .35);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .12);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: -.005em;
    opacity: 0;
    transform: translateY(6px) scale(.95);
    animation: splashStatIn .5s var(--ease-pop, cubic-bezier(.34, 1.56, .64, 1)) forwards;
  }
  .player-splash-stat .stat-emoji { font-size: 13px; }
  .player-splash-stat:nth-child(1) { animation-delay: 2.0s; }
  .player-splash-stat:nth-child(2) { animation-delay: 2.15s; }
  .player-splash-stat:nth-child(3) { animation-delay: 2.3s; }
  .player-splash-stat--accent {
    background: rgba(251, 191, 36, .15);
    border-color: rgba(251, 191, 36, .35);
    color: #fbbf24;
  }

  .player-splash-pulse {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    animation: splashFadeIn .4s ease 1.6s forwards;
  }
  .player-splash-pulse span {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    animation: splashPulseDot 1.3s ease-in-out infinite;
  }
  .player-splash-pulse span:nth-child(2) { animation-delay: .15s; }
  .player-splash-pulse span:nth-child(3) { animation-delay: .3s; }

  .player-splash-msg {
    display: block;
    margin-top: 14px;
    min-height: 1.2em;
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255, 255, 255, .55);
    opacity: 0;
    letter-spacing: -.005em;
    transition: opacity .35s ease;
  }
  .player-splash-msg.is-visible { opacity: 1; }

  @keyframes splashBrandIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes splashTitleIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes splashFadeIn {
    to { opacity: 1; }
  }
  @keyframes splashStatIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes splashPulseDot {
    0%, 100% { opacity: .35; transform: scale(.85); }
    50%      { opacity: 1; transform: scale(1.1); }
  }

  .player-play.is-launching {
    animation: playButtonMorph .25s ease forwards;
    pointer-events: none;
  }
  @keyframes playButtonMorph {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.15); }
    100% { transform: scale(.85); opacity: 0; }
  }

  @media (max-width: 560px) {
    .player-splash-card { padding: 16px 20px; }
    .player-splash-brand { margin-bottom: 20px; }
    .player-splash-brand-logo { width: 32px; height: 32px; }
    .player-splash-stats { margin-top: 18px; gap: 6px; }
    .player-splash-stat { padding: 6px 11px; font-size: 11px; }
    .player-splash-pulse { margin-top: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .player-splash-cover,
    .player-splash-vignette,
    .player-splash-particle,
    .player-splash-brand,
    .player-splash-title,
    .player-splash-byline,
    .player-splash-stat,
    .player-splash-pulse,
    .player-splash-pulse span,
    .player-play.is-launching {
      animation: none;
    }
    .player-splash-brand,
    .player-splash-title,
    .player-splash-byline,
    .player-splash-stat,
    .player-splash-pulse {
      opacity: 1;
      transform: none;
    }
    .player-play.is-launching { opacity: 0; }
    .player-splash-msg { transition: none; }
  }

  </style>

  <script>

  function getMeta(prop) {
    var el = document.querySelector('meta[property="' + prop + '"]');
    var v = el ? (el.getAttribute('content') || '') : '';
    return v.trim();
  }
  function getMetaJSON(prop) {
    var v = getMeta(prop);
    if (!v) return null;

    try { return JSON.parse(atob(v)); } catch (e1) {
      try { return JSON.parse(v); } catch (e2) { return null; }
    }
  }

  var META = {
    title:        getMeta('wgp:title')        || 'Game',
    logo:         getMeta('wgp:logo'),
    logoType:     getMeta('wgp:logo_type')    || 'auto',
    image:        getMeta('wgp:image'),
    url:          getMeta('wgp:url'),
    siteUrl:      getMeta('wgp:site_url'),
    description:  getMeta('wgp:description'),
    instructions: getMeta('wgp:instructions'),
    keyboard:     getMeta('wgp:keyboard'),
    developer:    getMeta('wgp:developer'),
    trailer:      getMeta('wgp:trailer'),
    pegi:         getMeta('wgp:pegi'),
    orientation:  getMeta('wgp:orientation') || 'landscape',
    controls:     getMetaJSON('wgp:controls') || {},
    info:         getMetaJSON('wgp:info')     || { tags: [], characters: [] },
    related:      getMetaJSON('wgp:related')  || [],
    loadfailTimeout: getMeta('wgp:loadfail_timeout')
  };

  (function populateSplash() {
    document.title = META.title;

    var coverEl = document.getElementById('playerCover');
    if (coverEl && META.image) {
      coverEl.style.backgroundImage =
        'linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.7) 100%), url(' + META.image + ')';
    }

    var titleEl = document.getElementById('playerTitle');
    if (titleEl) titleEl.textContent = META.title;

    var taglineEl = document.getElementById('playerTagline');
    if (taglineEl && META.description) {
      var firstSentence = META.description.split(/(?<=[.!?])\s+/)[0] || META.description;
      var snippet = firstSentence.length > 160 ? firstSentence.slice(0, 158) + '…' : firstSentence;
      taglineEl.textContent = snippet;
    }

    var trailerBtn = document.getElementById('trailerBtn');
    if (trailerBtn && META.trailer) {
      trailerBtn.hidden = false;
      trailerBtn.dataset.trailer = META.trailer;
      trailerBtn.dataset.trailerTitle = META.title;
    }

    var metaEl = document.getElementById('playerMeta');
    if (metaEl) {
      var tagNames = (META.info.tags || []).slice(0, 2).map(function(t) {
        return (t && t.name) ? t.name : (typeof t === 'string' ? t : '');
      }).filter(Boolean);

      var parts = [];
      if (tagNames.length) {
        parts.push(
          '<span>' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/></svg>' +
            escapeHTML(tagNames[0]) +
          '</span>'
        );
        if (tagNames[1]) {
          parts.push('<span class="dot-sep"></span><span>' + escapeHTML(tagNames[1]) + '</span>');
        }
        parts.push('<span class="dot-sep"></span>');
      }
      parts.push(
        '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> Loads in seconds</span>' +
        '<span class="dot-sep"></span>' +
        '<span class="ad-notice" title="A short video ad plays before the game starts. Revenue keeps games free to play.">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>' +
          ' Short ad before play' +
          '<svg class="ad-info" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/></svg>' +
        '</span>'
      );
      metaEl.innerHTML = parts.join('');
    }
  })();

  function escapeHTML(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }

  (function() {
    var frame    = document.getElementById('playerFrame');
    var slot     = document.getElementById('playerSlot');
    var playBtn  = document.getElementById('playerPlay');
    var controls = document.getElementById('playerControls');
    if (!frame || !slot || !playBtn) return;

    var loaded = false;

    var MIN_SPLASH_MS = 1500;
    var MAX_WAIT_MS   = 30000;
    var FIRST_MSG_THRESHOLD = 3000;
    var STILL_LOADING_THRESHOLD = 6000;
    var FIRST_MSG = 'Just a moment…';

    try {
      var match = (location.search || '').match(/[?&]min-splash=(\d+)/);
      if (match) MIN_SPLASH_MS = Math.max(0, parseInt(match[1], 10));
    } catch (e) {}
    window.wgpDebugMinSplash = function(ms) {
      MIN_SPLASH_MS = Math.max(0, parseInt(ms, 10) || 0);
      console.log('[wgpDebugMinSplash] MIN_SPLASH_MS set to', MIN_SPLASH_MS);
    };

    function splashMarkup() {

      var particles = '';
      var SEED = 17;
      for (var i = 0; i < 15; i++) {
        var x      = (i * SEED * 37 % 100);
        var drift  = ((i * 13) % 21) - 10;
        var size   = 0.6 + ((i * 7) % 9) / 10;
        var dur    = 4.5 + ((i * 11) % 30) / 10;
        var delay  = (i * SEED * 23 % 80) / 10;
        particles +=
          '<span class="player-splash-particle" style="' +
            '--x:' + x + '%;' +
            '--drift:' + drift + 'vw;' +
            '--size:' + size + ';' +
            '--dur:' + dur + 's;' +
            '--delay:' + delay + 's;' +
          '"></span>';
      }

      var byline = META.developer
        ? 'by ' + escapeHTML(META.developer)
        : '';
      return (
        '<div class="player-splash" id="playerSplash">' +
          '<div class="player-splash-cover"></div>' +
          '<div class="player-splash-vignette"></div>' +
          '<div class="player-splash-grain"></div>' +
          '<div class="player-splash-particles" aria-hidden="true">' + particles + '</div>' +
          '<div class="player-splash-card">' +
            '<span class="player-splash-halo" aria-hidden="true"></span>' +
            '<div class="player-splash-brand">' +
              '<img class="player-splash-brand-logo" ' +
                  'src="https://www.wgplayground.com/public/new/images/logo-square.svg" ' +
                  'alt="" aria-hidden="true">' +
              '<span class="player-splash-brand-block">' +
                '<span class="player-splash-brand-text">WGPlayground</span>' +
                '<span class="player-splash-eyebrow">Presents</span>' +
              '</span>' +
            '</div>' +
            '<div class="player-splash-logo-wrap">' +
              '<span class="player-splash-logo-scrim" aria-hidden="true"></span>' +
              '<img class="player-splash-logo" id="playerSplashLogo" alt="' + escapeHTML(META.title) + '">' +
            '</div>' +

      }

      document.getElementById('ovInfo').innerHTML = html;
    }
    renderInfo();

    var AREAS = ['a','b','c','d','e','f','g','h'];
    var ovRelatedGrid = document.getElementById('ovRelatedGrid');
    ovRelatedGrid.innerHTML = (META.related || []).slice(0, 8).map(function(g, i) {
      var area = AREAS[i];
      var isHero = area === 'a';
      var pipHtml = g.pip ? '<span class="ov-bpip ' + escapeHTML(g.pip) + '">' + escapeHTML(g.pip) + '</span>' : '';
      var artBg = g.art ? g.art
                : g.image ? ('url(' + g.image + ') center/cover')
                : 'linear-gradient(135deg, #4a1d9b, #c084fc)';
      var silSvg = g.silhouette
        ? '<svg class="ov-bsil" viewBox="0 0 100 100">' + g.silhouette + '</svg>'
        : '';

      var metaInner = '';
      if (isHero) {
        if (g.eyebrow) metaInner += '<span class="ov-beyebrow">' + escapeHTML(g.eyebrow) + '</span>';
        metaInner += '<h3 class="ov-btitle">' + escapeHTML(g.name || '') + '</h3>';
        if (g.tagline) metaInner += '<p class="ov-btagline">' + escapeHTML(g.tagline) + '</p>';
      } else {
        metaInner += '<h3 class="ov-btitle">' + escapeHTML(g.name || '') + '</h3>';
      }
      if (g.rating != null || g.plays != null) {
        metaInner += '<div class="ov-bmeta-row">';
        if (g.rating != null) {
          metaInner += '<span><span class="star">★</span> ' + escapeHTML(String(g.rating)) + '</span>';
        }
        if (g.rating != null && g.plays != null) {
          metaInner += '<span class="ov-bmeta-sep"></span>';
        }
        if (g.plays != null) {
          metaInner += '<span>' + escapeHTML(String(g.plays)) + ' played</span>';
        }
        metaInner += '</div>';
      }

      return '<a class="ov-bcard ov-bcard-' + area + '" href="' + (g.url || '#') + '" target="_blank" rel="noopener">' +
                pipHtml +
                '<div class="ov-bart" style="background:' + artBg + '">' + silSvg + '</div>' +
                '<div class="ov-bmeta">' + metaInner + '</div>' +
              '</a>';
    }).join('');

    var heroCard = ovRelatedGrid.querySelector('.ov-bcard-a');
    if (heroCard) {
      heroCard.addEventListener('mousemove', function(e) {
        var r = heroCard.getBoundingClientRect();
        heroCard.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100) + '%');
        heroCard.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
      });
    }

    var MODES = {
      controls: {
        label: 'Game controls',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/></svg>'
      },
      info: {
        label: 'Game info',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/></svg>'
      },
      related: {
        label: 'More games like this',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'
      },
      trailer: { label: 'Trailer', icon: '' }
    };

    var lastFocus = null;
    var currentMode = null;

    function openMode(mode, opts) {
      opts = opts || {};
      lastFocus = document.activeElement;
      currentMode = mode;

      if (mode === 'trailer') {
        overlayHeader.style.display = 'none';

        if( typeof WGPlayer !== "undefined" ){
          WGPlayer[Object.keys(WGPlayer)[0]].Resume();
        }else{
          if (META.trailer) {

              window.WGVideoPlayer = window.wgVideoPlayer || window.WGVideoPlayer || [];
              window.WGVideoPlayer.setup = window.WGVideoPlayer.setup || window.WGVideoPlayer.push;

              var hlsUrl = META.trailer.replace(/\.mp4(\?|$)/i, '.m3u8$1');
              var poster = META.image || '';
              if (poster && poster.indexOf('scout.wgimager.com') === -1) {
                poster = 'https://scout.wgimager.com/f_webp/w_640/h_480/q_90/' + poster;
              }

              window.WGVideoPlayer.setup({
                id: 'ovTrailerPlayer',
                videoSrc: hlsUrl,
                videoPoster: poster,
                autoPlay: true,
                streamType: 'm3u8',
                ads: false
              });

            }

        }
      } else {
        overlayHeader.style.display = '';
        overlayIcon.innerHTML = MODES[mode].icon;
        overlayLabel.textContent = MODES[mode].label;
      }

      overlay.querySelectorAll('.ov-mode').forEach(function(m) { m.classList.remove('is-active'); });
      var activeEl = overlay.querySelector('.ov-' + mode);
      if (activeEl) activeEl.classList.add('is-active');

      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      playerFrame.classList.add('has-overlay');

      var btnToFocus = (mode === 'trailer') ? overlayTrailerClose : overlayClose;
      requestAnimationFrame(function() { btnToFocus.focus(); });
    }

    function closeOverlay() {
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      playerFrame.classList.remove('has-overlay');

      try { document.dispatchEvent(new Event('wgVideoPlayerPause')); } catch (e) {}
      currentMode = null;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    // Host that embeds this iframe (the page the player is framed in).
    function embedHost() {
      var ref = '';
      try { ref = window.referer_url || ''; } catch (e) {}
      if (!ref) { try { ref = new URLSearchParams(location.search).get('wg_sdk_referrer_url') || ''; } catch (e) {} }
      if (!ref) { try { ref = document.referrer || ''; } catch (e) {} }
      if (!ref) { try { if (window.top !== window.self && window.top.location && window.top.location.href) ref = window.top.location.href; } catch (e) {} }
      if (!ref) return '';
      try { return new URL(ref).hostname.toLowerCase(); }
      catch (e) {
        var m = /^[a-z][a-z0-9+.\-]*:\/\/([^\/:?#]+)/i.exec(String(ref));
        return m ? m[1].toLowerCase() : '';
      }
    }
    // Related games is shown ONLY when embedded from www.wgplayground.com.
    var relatedAllowed = (embedHost() === 'www.wgplayground.com');

    if (controlsBtn) controlsBtn.addEventListener('click', function() { openMode('controls'); });
    if (infoBtn)     infoBtn.addEventListener('click',     function() { openMode('info'); });
    if (relatedBtn) {
      if (relatedAllowed) {
        relatedBtn.addEventListener('click', function() { openMode('related'); });
      } else {
        relatedBtn.style.display = 'none';
      }
    }

    if (splashTrailerBtn) {
      splashTrailerBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        openMode('trailer', {
          trailerUrl: splashTrailerBtn.dataset.trailer,
          trailerTitle: splashTrailerBtn.dataset.trailerTitle || META.title
        });
      }, true);
    }

    overlayClose.addEventListener('click', closeOverlay);
    overlayTrailerClose.addEventListener('click', closeOverlay);

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeOverlay();
    });

    var overlayBody = document.getElementById('overlayBody');
    var ovControlsEl = document.getElementById('ovControls');
    var ovInfoEl = document.getElementById('ovInfo');
    overlayBody.addEventListener('click', function(e) {
      if (currentMode !== 'controls' && currentMode !== 'info') return;
      if (e.target === overlayBody || e.target === ovControlsEl || e.target === ovInfoEl) {
        closeOverlay();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeOverlay();
    });
  })();

  (function() {
    var chip = document.getElementById('brandChip');
    var pop = document.getElementById('brandPopover');
    if (!chip || !pop) return;

    // On y8.com (and any subdomain) hide only the "Learn more" CTA; the brand
    // chip itself works normally on every host.
    var h = (function() {
      var ref = '';
      try { ref = window.referer_url || ''; } catch (e) {}
      if (!ref) { try { ref = new URLSearchParams(location.search).get('wg_sdk_referrer_url') || ''; } catch (e) {} }
      if (!ref) { try { ref = document.referrer || ''; } catch (e) {} }
      if (!ref) { try { if (window.top !== window.self && window.top.location && window.top.location.href) ref = window.top.location.href; } catch (e) {} }
      if (!ref) return '';
      try { return new URL(ref).hostname.toLowerCase(); }
      catch (e) {
        var m = /^[a-z][a-z0-9+.\-]*:\/\/([^\/:?#]+)/i.exec(String(ref));
        return m ? m[1].toLowerCase() : '';
      }
    })();
    if (h === 'y8.com' || h.slice(-7) === '.y8.com') {
      var cta = pop.querySelector('.popover-cta');
      if (cta) cta.style.display = 'none';
    }

    function closePop() {
      pop.classList.remove('is-open');
      chip.setAttribute('aria-expanded', 'false');
    }
    chip.addEventListener('click', function(e) {
      e.stopPropagation();
      var isOpen = chip.getAttribute('aria-expanded') === 'true';
      if (isOpen) closePop();
      else { pop.classList.add('is-open'); chip.setAttribute('aria-expanded', 'true'); }
    });
    pop.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', closePop);
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePop(); });
  })();

  window.addEventListener('message', function(e) {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'wgp-theme') {
      var t = e.data.value;
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    }
  });

  (function() {
    var m = location.search.match(/[?&]theme=(light|dark)/);
    if (m) document.documentElement.setAttribute('data-theme', m[1]);
  })();
