name: Check embedded games

on:
  workflow_dispatch:
    inputs:
      control:
        description: 'A URL known to be dead (e.g. a made-up game id), printed in full for comparison'
        required: false
        default: 'https://play.wgplayground.com/ifr/zzzz-not-a-real-game-0000'

permissions:
  contents: write

concurrency:
  group: check-embeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check embeds
        env:
          CONTROL: ${{ inputs.control }}
        run: python scripts/check_embeds.py

      - name: Commit results
        run: |
          git add data/audits
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "Embed check, run $(date -u +%F)"
          git pull --rebase --autostash
          git push
