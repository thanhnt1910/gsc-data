name: Gap domains check

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max domains to check (default 60)'
        required: false
      max_rank:
        description: 'Only domains with harmonic rank below this (default 3000000)'
        required: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the gap domains
        env:
          LIMIT: ${{ inputs.limit }}
          MAX_RANK: ${{ inputs.max_rank }}
        run: python scripts/gap_check.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add data/prospects
          git diff --cached --quiet && exit 0
          git commit -m "Gap domains check, run $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break || sleep 5; done
