name: Fetch Search Console data

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
    - cron: '47 3 * * 1' # Mondays: also check index status
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-download the full 16 months'
        type: boolean
        default: false
      days:
        description: 'Days to re-download on a normal run'
        default: '10'
      inspect:
        description: 'Also check index status of every sitemap URL'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-gsc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          BACKFILL: ${{ inputs.backfill }}
          DAYS: ${{ inputs.days }}
        run: python scripts/fetch_gsc.py

      - name: Fetch GA4 data
        # A GA4 problem (API not enabled, access removed) must not block the
        # Search Console data from being committed.
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY: ${{ vars.GA4_PROPERTY }}
          BACKFILL: ${{ inputs.backfill }}
          DAYS: ${{ inputs.days }}
        run: python scripts/fetch_ga4.py

      - name: Fetch Bing Webmaster data
        # Same as GA4: a Bing problem (no key yet, key revoked) must not
        # block the Search Console data from being committed.
        continue-on-error: true
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_SITE: ${{ vars.BING_SITE }}
        run: python scripts/fetch_bing.py

      - name: Check index status
        if: inputs.inspect || github.event.schedule == '47 3 * * 1'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: python scripts/inspect_index.py

      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "Search Console data, run $(date -u +%F)"
          git push
