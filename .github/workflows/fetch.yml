name: Fetch Search Console data

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-download the full 16 months'
        type: boolean
        default: false
      days:
        description: 'Days to re-download on a normal run'
        default: '10'

permissions:
  contents: write

concurrency:
  group: fetch-gsc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          BACKFILL: ${{ inputs.backfill }}
          DAYS: ${{ inputs.days }}
        run: python scripts/fetch_gsc.py

      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "Search Console data, run $(date -u +%F)"
          git push
