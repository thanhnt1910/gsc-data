name: Site audit (on-page SEO snapshot)

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Domains to audit, comma-separated (max 5)'
        required: true

permissions:
  contents: write

concurrency:
  group: site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit sites
        env:
          SITES: ${{ inputs.sites }}
        run: python scripts/site_audit.py

      - name: Commit results
        run: |
          git add data/audits
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "Site audit, run $(date -u +%F)"
          git pull --rebase --autostash
          git push
