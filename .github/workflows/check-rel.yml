name: Check backlink prospects (rel)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Page URLs to check, comma-separated (max 50)'
        required: true

permissions:
  contents: write

concurrency:
  group: check-rel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check pages
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/check_rel.py

      - name: Commit results
        run: |
          git add data/prospects
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git commit -m "Backlink prospect check, run $(date -u +%F)"
          git pull --rebase --autostash
          git push
