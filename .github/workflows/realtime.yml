name: GA4 realtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Print realtime and today's activity
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY: ${{ vars.GA4_PROPERTY }}
        run: python scripts/ga4_realtime.py
