name: Check link prospects

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma-separated domains to check'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check each site
        env:
          SITES: ${{ inputs.sites }}
        run: python scripts/check_prospects.py
